<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Final Form</title>
<meta name="description" content="Final Form: lose weight on a real schedule, track steps, workouts and runs, and rank up from Bronze to One Above All.">
<meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Final Form">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --scale:1;
  --bg1:#17172a;--bg2:#07070c;--card:rgba(255,255,255,.06);--card-solid:#15151f;--stroke:rgba(255,255,255,.10);
  --text:#fff;--muted:rgba(255,255,255,.64);--track:rgba(255,255,255,.10);
  --good:#3ee08f;--warn:#ffc145;--bad:#ff5c77;--info:#5ec8ff;--gold:#ffd54a;--strava:#ff6a26;
  --a1:#ff8a1f;--a2:#ff3d54;--on-accent:#fff;
  --sheet:#14141e;--shadow:none;
  --radius:22px;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg1:#f6f5fb;--bg2:#e8e7f1;--card:rgba(255,255,255,.92);--card-solid:#fff;--stroke:rgba(0,0,0,.08);
  --text:#14141c;--muted:rgba(20,20,28,.64);--track:rgba(20,20,28,.08);
  --good:#0e8a4a;--warn:#a35f00;--bad:#c0263d;--info:#0b6bb0;--gold:#9a6b00;--strava:#d13f00;
  --sheet:#fbfaff;--shadow:0 6px 18px rgba(0,0,0,.06);
  color-scheme:light;
}
html.hc{--stroke:rgba(255,255,255,.6);--muted:rgba(255,255,255,.9);--card:rgba(255,255,255,.12)}
html.hc[data-theme="light"]{--stroke:rgba(0,0,0,.6);--muted:rgba(20,20,28,.9);--card:#fff}
html.cb{--good:#56b4e9;--warn:#e69f00;--bad:#ff8a4c;--info:#cc79a7}
html.cb[data-theme="light"]{--good:#0072b2;--warn:#a65e00;--bad:#b34700;--info:#8e3b6b}
html.bold body{font-weight:600}
html.bold b,html.bold strong,html.bold h1,html.bold h2,html.bold h3{font-weight:900}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
html.rm *{animation:none!important;transition:none!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  color:var(--text);background:var(--bg2);min-height:100vh;min-height:100dvh;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(110% 60% at 95% -5%,color-mix(in srgb,var(--a1) 22%,transparent),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--a1);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.page{display:flex;flex-direction:column;gap:14px}
h1{font-size:2rem;font-weight:900;letter-spacing:-.02em;margin:4px 0}
h2{font-size:1.06rem;font-weight:800;margin:0}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.tiny{font-size:.72rem}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.center{text-align:center}
.wrap{flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
html.hc .card{border-width:1.5px}
.card-h{display:flex;align-items:center;gap:8px}
.card-h .ico{color:var(--a1)}
.card-h h2{flex:1}
.label{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
html.big .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .v{font-size:1.2rem;font-weight:900;margin-top:2px;overflow-wrap:anywhere}
.stat .c{font-size:.72rem;color:var(--muted)}

.ico{width:1.3em;height:1.3em;flex:none;fill:currentColor;display:inline-block;vertical-align:middle}
.ico.lg{width:1.6em;height:1.6em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:999px;border:0;font-weight:800;font-size:1rem;color:var(--on-accent);
  background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 6px 16px color-mix(in srgb,var(--a1) 35%,transparent)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--stroke);box-shadow:none}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
.btn.health{background:linear-gradient(90deg,#ff375f,#ff7a93);color:#fff}
.btn.food{background:linear-gradient(90deg,#22c77a,#1c8fe8);color:#fff}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.9rem}
.link{background:none;border:0;color:var(--a1);font-weight:800;padding:10px 4px;min-height:44px}
.link.bad{color:var(--bad)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:disabled{opacity:.3}
.icon-btn.tonal{background:var(--card);border:1px solid var(--stroke)}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.action{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:20px;background:var(--card);border:1px solid var(--stroke);font-weight:800;font-size:.85rem}
.action .bubble{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}

.header{display:flex;align-items:center;gap:12px;padding-top:6px}
.greet{color:var(--muted);font-size:.95rem}
.name{font-size:1.9rem;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.streak{font-size:.82rem;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:4px}
.streak.on{color:#ff8a1f}
.rankchip{display:flex;flex-direction:column;align-items:flex-end;gap:4px;background:none;border:0;padding:0;text-align:right}

.daypick{display:flex;align-items:center;background:var(--card);border:1px solid var(--stroke);border-radius:999px;padding:2px}
.daypick .mid{flex:1;text-align:center}

.ringwrap{display:flex;gap:18px;align-items:center}
html.big .ringwrap{flex-direction:column}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:1.9rem;font-weight:900;line-height:1}
.ring circle{transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}

.bar{height:10px;border-radius:10px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .6s}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:.75rem;font-weight:900}
.entry{display:flex;align-items:center;gap:12px;min-height:48px}
.entry .bub{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.entry .t{font-weight:700;font-size:.95rem}
.entry .s{font-size:.78rem;color:var(--muted)}
.entry .val{font-weight:800}
.entry.tap{background:none;border:0;padding:0;text-align:left;width:100%}
.sect{font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);
  background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--stroke)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:.68rem;font-weight:800;padding:6px 0;min-height:52px}
.tab[aria-current="page"]{color:var(--a1)}
.tab.rec .dot{width:58px;height:58px;margin-top:-26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-accent);
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 20px color-mix(in srgb,var(--a1) 45%,transparent);border:4px solid var(--bg2)}
.tab.rec.live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a1) 55%,transparent)}50%{box-shadow:0 0 0 12px transparent}}

/* Inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:.85rem;color:var(--muted)}
.input{width:100%;min-height:50px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--stroke);background:var(--card);color:var(--text);font-size:1rem}
.input:focus{border-color:var(--a1);outline:none}
.input.big{font-size:1.8rem;font-weight:900}
.suffix{position:relative}
.suffix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:800}
.seg{display:flex;background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:transparent;font-weight:800;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(90deg,var(--a1),var(--a2));color:var(--on-accent)}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1.5px solid var(--stroke);background:var(--card);text-align:left;width:100%}
.opt[aria-checked="true"]{border-color:var(--a1)}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center}
.opt[aria-checked="true"] .radio{border-color:var(--a1)}
.opt[aria-checked="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--a1)}
.switch{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;background:none;border:0;padding:4px 0;text-align:left}
.switch .tr{width:50px;height:30px;border-radius:30px;background:var(--track);position:relative;flex:none;border:1px solid var(--stroke)}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"] .tr{background:var(--a1)}
.switch[aria-checked="true"] .tr::after{transform:translateX(20px)}
.lrow{display:flex;align-items:center;gap:10px;min-height:50px;width:100%;background:none;border:0;padding:4px 0;text-align:left;border-bottom:1px solid var(--stroke)}
.lrow:last-child{border-bottom:0}
.lrow .v{color:var(--muted);font-weight:700;text-align:right}
input[type=range]{width:100%;accent-color:var(--a1);min-height:44px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrapc{flex-wrap:wrap;justify-content:center;overflow:visible}
.chips::-webkit-scrollbar{display:none}
.chipbtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--stroke);background:var(--card);font-weight:800;font-size:.85rem}
.chipbtn[aria-pressed="true"]{border-color:var(--a1);color:var(--a1)}

/* Sheets */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--sheet);border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);animation:up .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--track);margin:2px auto 4px}
.sheet h2{font-size:1.5rem;font-weight:900}
.dialog{align-items:center}
.dialog .sheet{border-radius:26px;margin:16px;max-width:420px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);z-index:60;background:var(--card-solid);color:var(--text);border:1px solid var(--stroke);padding:12px 18px;border-radius:14px;font-weight:700;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none}

/* Recorder */
.recorder{position:fixed;inset:0;z-index:40;background:var(--bg2);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.recorder::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(110% 60% at 95% -5%,color-mix(in srgb,var(--a1) 22%,transparent),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2))}
.recorder .top{display:flex;align-items:center;gap:8px;min-height:48px}
.recorder .map{flex:1;min-height:150px;border-radius:22px;border:1px solid var(--stroke);overflow:hidden;position:relative;
  background:linear-gradient(135deg,color-mix(in srgb,var(--bg1) 90%,var(--a1)),var(--bg2))}
.recorder .map svg{width:100%;height:100%;display:block}
.recorder .map .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:700;text-align:center;padding:16px}
.recorder .clock{font-size:4rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;text-align:center}
.recorder .m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.recorder .m.two{grid-template-columns:repeat(2,1fr)}
.recorder .m .v{font-size:1.55rem;font-weight:900;font-variant-numeric:tabular-nums}
.recorder .m .u{font-size:.8rem;color:var(--muted);font-weight:800}
.ctrls{display:flex;justify-content:space-evenly;align-items:flex-start;padding-top:6px}
.round{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;font-weight:900}
.round .c{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-accent);
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 26px color-mix(in srgb,var(--a1) 45%,transparent)}
.round .c .ico{width:46px;height:46px}
.round.outline .c{background:var(--card);color:var(--text);border:2.5px solid var(--text);box-shadow:none}
.paused{align-self:center;padding:5px 14px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);font-weight:900;letter-spacing:.15em}

/* Logo */
.logo{font-weight:900;line-height:.95;letter-spacing:.12em}
.logo .a{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .rule{height:4px;border-radius:4px;margin-top:8px;background:linear-gradient(90deg,var(--a1),var(--a2),transparent)}

.emblem{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;border:3px solid rgba(255,255,255,.4);flex:none}
.emblem .ico{width:46%;height:46%}
.emblem.locked{filter:grayscale(1);opacity:.4;box-shadow:none!important}
.ladder{display:flex;gap:14px;overflow-x:auto;padding:4px 2px}
.ladder .t{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:76px;font-size:.72rem;font-weight:800;text-align:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
html.big .grid2{grid-template-columns:1fr}
.ach{border-radius:18px;padding:12px;border:1px solid var(--stroke);background:color-mix(in srgb,var(--text) 4%,transparent);display:flex;flex-direction:column;gap:4px}
.ach.on{border-color:color-mix(in srgb,var(--a1) 55%,transparent);background:color-mix(in srgb,var(--text) 7%,transparent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:92px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;font-weight:800}
.sw .g{width:100%;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;border:2.5px solid transparent;color:#fff}
.sw[aria-pressed="true"] .g{border-color:var(--text)}
.sw:disabled .g{filter:grayscale(1);opacity:.35}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:3px;vertical-align:middle;margin-right:6px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--info) 14%,transparent);border:1px solid color-mix(in srgb,var(--info) 40%,transparent);font-size:.88rem}
.steps-onb{display:flex;gap:6px}
.steps-onb i{flex:1;height:5px;border-radius:5px;background:var(--track)}
.steps-onb i.on{background:linear-gradient(90deg,var(--a1),var(--a2))}
.obfoot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:color-mix(in srgb,var(--bg2) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.obfoot .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.warnmsg{color:var(--warn);text-align:center;font-weight:700;font-size:.9rem}
details summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
</style>
</head>
<body>
<main id="app" aria-live="off"></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Final Form needs JavaScript turned on.</p></noscript>
<script src="app.js"></script>
</body>
</html>
